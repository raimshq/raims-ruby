# Template for future activation on authorized CodeBuild runners.
name: Validate Ruby SDK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raims-ruby-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: '0'
  RAIMS_RUBY_TOOLKIT_REF: ${{ vars.RAIMS_RUBY_TOOLKIT_REF }}

jobs:
  validateRuby:
    if: github.repository == 'raimshq/raims-ruby'
    runs-on:
      - codebuild-raims-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
      - ruby-sdk-check
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the repository commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: Raims-Ruby
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Require the reviewed validation tooling revision
        run: |
          python - <<'PY'
          import os
          import re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ.get('RAIMS_RUBY_TOOLKIT_REF', '')):
              raise SystemExit('Set RAIMS_RUBY_TOOLKIT_REF to the reviewed Toolkit commit SHA.')
          PY

      - name: Create a read-only validation source token
        id: sources
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RAIMS_CI_SOURCE_READER_CLIENT_ID }}
          private-key: ${{ secrets.RAIMS_CI_SOURCE_READER_PRIVATE_KEY }}
          owner: raimshq
          repositories: Raims-Developer-Toolkit
          permission-contents: read

      - name: Checkout the reviewed validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: raimshq/Raims-Developer-Toolkit
          ref: ${{ env.RAIMS_RUBY_TOOLKIT_REF }}
          path: Developer-Toolkit
          token: ${{ steps.sources.outputs.token }}
          persist-credentials: false

      - name: Run canonical runtime and security gates
        run: |
          cp Raims-Ruby/AGENTS.md AGENTS.md
          python Raims-Ruby/scripts/check.py --output "$GITHUB_WORKSPACE/.tmp/raims-ruby-sdk/ci"
          python Developer-Toolkit/scripts/release-preflight/sdk_security.py --source Raims-Ruby --workspace "$GITHUB_WORKSPACE" --repository Raims-Ruby --output "$GITHUB_WORKSPACE/.tmp/raims-ruby-sdk/security" --prepare-tools
