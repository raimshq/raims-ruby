name: Publish Ruby SDK
'on':
  release:
    types:
    - published
permissions:
  contents: read
  actions: read
concurrency:
  group: raims-ruby-rubygems-release
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: '0'
  RAIMS_RUBY_TOOLKIT_REF: 239d5acaf5edade863551a391241c5f9567101bc
jobs:
  validateRelease:
    permissions:
      contents: write
      actions: read
    if: github.repository == 'raimshq/raims-ruby' && github.event.action == 'published' && !github.event.release.draft &&
      !github.event.release.prerelease
    runs-on:
    - codebuild-raims-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
    - ruby-sdk-release-check
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout the release commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        path: Raims-Ruby
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.14
    - name: Verify release, prior validation, and approved distribution bytes
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python Raims-Ruby/scripts/release.py prepare --source Raims-Ruby --artifact .tmp/raims-ruby-sdk/rubygems-upload
    - name: Upload the approved gem and public provenance
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: raims-rubygems-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .tmp/raims-ruby-sdk/rubygems-upload/dist/*
          .tmp/raims-ruby-sdk/rubygems-upload/release-manifest.json
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
  publishRubyGems:
    needs: validateRelease
    if: github.repository == 'raimshq/raims-ruby' && github.event.action == 'published' && !github.event.release.draft &&
      !github.event.release.prerelease
    environment:
      name: rubygems
      url: https://rubygems.org/gems/raims
    runs-on:
    - codebuild-raims-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
    - ruby-sdk-rubygems-publish
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout the release commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        path: Raims-Ruby
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.14
    - name: Setup Ruby for publishing
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94
      with:
        ruby-version: 4.0.9
        rubygems: default
        bundler: none
        bundler-cache: false
    - name: Download the approved gem from this validation job
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.validateRelease.outputs.artifact_id }}
        path: .tmp/raims-ruby-sdk/rubygems-upload
        merge-multiple: true
        digest-mismatch: error
    - name: Verify release and approved bytes before requesting publishing credentials
      id: verify
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python Raims-Ruby/scripts/release.py verify --source Raims-Ruby --artifact .tmp/raims-ruby-sdk/rubygems-upload
    - name: Obtain an ephemeral RubyGems publisher credential
      id: oidc
      if: steps.verify.outputs.publishRequired == 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: |
          const jwt = await core.getIDToken('rubygems.org');
          core.setSecret(jwt);
          const response = await fetch('https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token', {
            method: 'POST', redirect: 'error', signal: AbortSignal.timeout(30000),
            headers: {'content-type':'application/json','accept':'application/json'},
            body: JSON.stringify({jwt, owner:'255464'})
          });
          if (!response.ok) throw new Error('RubyGems OIDC exchange failed: HTTP ' + response.status);
          let value;
          try { value = await response.json(); } catch { throw new Error('RubyGems OIDC response is invalid.'); }
          if (typeof value.rubygems_api_key === 'string') core.setSecret(value.rubygems_api_key);
          if (typeof value.rubygems_api_key !== 'string' || value.rubygems_api_key.length < 16 ||
              value.rubygems_api_key.length > 4096 || /[\r\n]/.test(value.rubygems_api_key) ||
              !Array.isArray(value.scopes) || value.scopes.length !== 1 || value.scopes[0] !== 'push_rubygem' ||
              (value.gem != null && (typeof value.gem !== 'object' || Array.isArray(value.gem) || value.gem.name !== 'raims'))) {
            throw new Error('RubyGems OIDC credential scope is invalid.');
          }
          const expires = Date.parse(value.expires_at);
          if (!Number.isFinite(expires) || expires <= Date.now() || expires > Date.now()+20*60*1000) {
            throw new Error('RubyGems OIDC credential lifetime is invalid.');
          }
          core.setOutput('api-key',value.rubygems_api_key);
    - name: Publish the exact approved gem to RubyGems
      if: steps.verify.outputs.publishRequired == 'true'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GEM_HOST_API_KEY: ${{ steps.oidc.outputs.api-key }}
      run: python Raims-Ruby/scripts/release.py publish --source Raims-Ruby --artifact .tmp/raims-ruby-sdk/rubygems-upload
    - name: Confirm the public RubyGems artifact bytes
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python Raims-Ruby/scripts/release.py confirm --source Raims-Ruby --artifact .tmp/raims-ruby-sdk/rubygems-upload
